<div class="form-container">
  <div class="form-header">
    <h2>Sign up for Tweeter</h2>
    <a routerLink="/login" class="cancel-link">Cancelar</a>
  </div>

  <label>Username</label>
  <input type="text" [(ngModel)]="myPayloadUser.username" />

  <label>Email</label>
  <input type="email" [(ngModel)]="myPayloadUser.email" />

  <label>Password</label>
  <input type="password" [(ngModel)]="myPayloadUser.password" />
  <small class="note">Please provide a password of at least 8 chars</small>

  <label class="checkbox-label">
    <input type="checkbox" />
    I have read and agree to CRM-univ terms.
  </label>

  <button (click)="createUser()" class="btn-submit">Create</button>
</div>
